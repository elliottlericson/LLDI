name: "Test & Run GT Image (EC2-style) with host networking"

on:
  push:
    branches:
      - 'gt*'
  workflow_dispatch:

jobs:
  run-gt-instances:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        instance: ${{ range(1, 501) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get public IP
        run: |
          echo "Runner public IP: $(curl -s https://api.ipify.org)"

      - name: Verify Docker & AWS CLI
        run: |
          docker version
          aws --version

      - name: Create a SWAP
        run: |
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "/swapfile none swap sw 0 0" | sudo tee -a /etc/fstab

      - name: Install and start Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          sudo systemctl enable --now redis-server
          redis-cli ping

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:           ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Fetch `.env` from AWS Secrets Manager
        run: |
          aws secretsmanager get-secret-value \
            --secret-id ${{ secrets.AWS_SECRETS_MANAGER_SECRET_ID }} \
            --query SecretString --output text > app.env

      - name: Override REDIS_HOST for host networking in GH Actions
        run: |
          sed -i 's|^REDIS_HOST=.*|REDIS_HOST=127.0.0.1|' app.env

      - name: Pull Docker image
        run: |
          docker pull ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ secrets.IMAGE_TAG }}

      - name: Run container attached with host network
        run: |
          docker run --rm \
            --name gt-${{ matrix.instance }} \
            --network host \
            --shm-size 10g \
            --env-file app.env \
            --env AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            --env AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            --env AWS_REGION=${{ secrets.AWS_REGION }} \
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ secrets.IMAGE_TAG }}
