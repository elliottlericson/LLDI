name: "Test & Run GT Image (EC2-style) with concurrency"

on:
  push:
    branches:
      - 'gt*'
  workflow_dispatch:

jobs:
  run-gt-instances:
    runs-on: ubuntu-latest      # comes with Docker + awscli v1

    strategy:
      matrix:
        instance: [1]           # testing with a single instance
      max-parallel: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Docker is installed
        run: |
          echo "Docker version:" && docker version

      - name: Verify AWS CLI is installed
        run: |
          echo "AWS CLI version:" && aws --version

      - name: Create a SWAP
        run: |
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "/swapfile none swap sw 0 0" | sudo tee -a /etc/fstab

      - name: Install jq, unzip & curl
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip curl

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:           ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Fetch `.env` from AWS Secrets Manager
        run: |
          aws secretsmanager get-secret-value \
            --secret-id ${{ secrets.AWS_SECRETS_MANAGER_SECRET_ID }} \
            --query SecretString --output text > app.env

      - name: Pull Docker image
        run: |
          docker pull ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ secrets.IMAGE_TAG }}

      - name: Run container with .env & awslogs
        run: |
          LOG_STREAM="GH-Action-$(date +'%Y-%m-%d-%H-%M-%S')--$(uuidgen)"
          docker run -d \
            --name gt-${{ matrix.instance }} \
            --restart unless-stopped \
            --shm-size 10g \
            --log-driver awslogs \
            --log-opt awslogs-group=${{ secrets.AWS_LOG_GROUP }} \
            --log-opt awslogs-region=${{ secrets.AWS_REGION }} \
            --log-opt awslogs-stream="$LOG_STREAM" \
            --env-file app.env \
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ secrets.IMAGE_TAG }}
