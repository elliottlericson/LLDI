name: "Test & Run GT Image (EC2-style) with concurrency"

on:
  push:
    branches:
      - 'gt*'
  workflow_dispatch:

jobs:
  run-gt-instances:
    runs-on: ubuntu-latest      # comes with Docker + awscli v1

    strategy:
      matrix:
        instance: [1]           # testing with a single instance
      max-parallel: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get public IP
        run: |
          PUBLIC_IP=$(curl -s https://api.ipify.org)
          echo "Runner public IP: $PUBLIC_IP"

      - name: Verify Docker is installed
        run: docker version

      - name: Verify AWS CLI is installed
        run: aws --version

      - name: Create a SWAP
        run: |
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "/swapfile none swap sw 0 0" | sudo tee -a /etc/fstab

      - name: Install and start Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          sudo systemctl enable --now redis-server
          redis-cli ping

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:      ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key:  ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:             ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Fetch `.env` from AWS Secrets Manager
        run: |
          aws secretsmanager get-secret-value \
            --secret-id ${{ secrets.AWS_SECRETS_MANAGER_SECRET_ID }} \
            --query SecretString --output text > app.env

      - name: Override REDIS_HOST for GitHub runner
        run: |
          # point at host gateway instead of AWS ElastiCache
          sed -i 's|^REDIS_HOST=.*|REDIS_HOST=host.docker.internal|' app.env

      - name: Pull Docker image
        run: |
          docker pull ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ secrets.IMAGE_TAG }}

      # Consider using a CW Agent

      - name: Run container with .env & host-gateway mapping
        run: |
          docker run -d \
            --name gt-${{ matrix.instance }} \
            --add-host host.docker.internal:host-gateway \
            --restart unless-stopped \
            --shm-size 10g \
            --env-file app.env \
            --env AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            --env AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            --env AWS_REGION=${{ secrets.AWS_REGION }} \
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ secrets.IMAGE_TAG }}
